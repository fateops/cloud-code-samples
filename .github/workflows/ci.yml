name: CI Pipeline (Frontend & Backend)

on:
  push:
    branches: [ "v1" ]
  pull_request:
    branches: [ "v1" ]

env:
  # 基础路径变量，方便统一管理
  PROJECT_PATH: golang/go-guestbook

jobs:
  # ==========================
  # Job 1: 构建后端 (Backend)
  # ==========================
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          # 上下文指向 backend 目录，确保能找到里面的 Dockerfile
          context: ./${{ env.PROJECT_PATH }}/src/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/go-guestbook-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/go-guestbook-backend:${{ github.sha }}

  # ==========================
  # Job 2: 构建前端 (Frontend)
  # ==========================
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          # 上下文指向 frontend 目录
          context: ./${{ env.PROJECT_PATH }}/src/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/go-guestbook-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/go-guestbook-frontend:${{ github.sha }}
