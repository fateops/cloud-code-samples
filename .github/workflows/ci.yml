name: CI Pipeline

on:
  push:
    branches: [ "v1" ]
  pull_request:
    branches: [ "v1" ]

env:
  IMAGE_NAME: go-guestbook

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    # 【新增】设置默认的工作目录，让所有 step 都先 cd 进这里
    defaults:
      run:
        working-directory: ./golang/go-guestbook

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 登录 Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # 【修改】因为已经设置了 working-directory，这里的 context 指向当前目录即可
          # 或者写相对路径 ./src (前提是 src 在 go-guestbook 下面)
          context: ./golang/go-guestbook/src
          dockerfile: ./golang/go-guestbook/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
